<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertiv | Leave Portal Login</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand">VERTIV <span>◉</span> <span style="color:#b5c6dc">ENGINEER AVAILABILITY</span></div><span class="tag">SECURE SIGN IN · LIGHT</span></header><main><div class="panel login"><h1>Welcome back 👋</h1><p class="muted">Engineers: mark your leave. Admin: monitor team availability.</p><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button class="primary" type="submit" style="width:100%">Sign in</button></p><p id="message" class="error" role="status"></p></form><p class="muted small">Engineer first time? Admin must add your employee code and email in Manage Engineers first.</p><details><summary><strong>First-time engineer activation</strong></summary><form id="register"><label>Registered Email</label><input id="regEmail" type="email" autocomplete="email" required><label>Create a private password</label><input id="regPassword" type="password" minlength="10" autocomplete="new-password" required><button class="primary" type="submit">Activate Engineer Login</button></form><p id="registerMessage" class="muted small" role="status"></p></details></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>startLogin()</script></body></html>
